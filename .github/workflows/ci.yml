name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test -- --run

  phpstan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-drupal
      - run: ./bin/phpstan analyse web/modules/custom --debug

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-drupal
      - run: ./bin/phpcs

  phpunit:
    runs-on: ubuntu-latest
    env:
      SIMPLETEST_DB: sqlite://localhost//tmp/drupal-test.sqlite
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-drupal
      - name: Create files directory
        run: mkdir -p web/sites/default/files && chmod 777 web/sites/default/files
      - run: ./bin/phpunit web/modules/custom --no-coverage

  e2e_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Set up from the tested commit, since master may not have this action.
      # The settings file is ignored by Git and survives the checkouts below.
      - uses: ./.github/actions/setup-drupal
      # Install from master first so updates and config import run against
      # the production schema, like a deployment.
      # Forced, because composer install scaffolds files into the work tree,
      # such as entries in .gitignore, and installs again after each switch.
      - name: Switch to master for original install
        run: git checkout --force origin/master
      # Start from an empty tree: Composer loads plugins from the installed
      # vendor directory, which still holds the tested commit's packages.
      - name: Install Composer dependencies for master
        run: |
          rm -rf vendor web/core web/modules/contrib web/themes/contrib web/profiles/contrib drush/Commands/contrib
          composer install -n --prefer-dist
      - name: Install backend
        run: ./bin/drush -y site-install --account-pass=admin
      - name: Switch back to the tested commit
        run: git checkout --force ${{ github.sha }}
      - name: Install Composer dependencies for the tested commit
        run: composer install -n --prefer-dist
      # Picks up a change in `deployment_identifier`. Drupal creates the table
      # again when it next caches the container.
      - name: Clear container cache
        run: ./bin/drush sql:query "DROP TABLE IF EXISTS cache_container;"
      - name: Run updates
        run: ./bin/drush updb -y
      - name: Import config
        run: ./bin/drush cim -y
      - name: Check for config changes
        run: |
          ./bin/drush config:status 2>&1
          ./bin/drush config:status 2>&1 | grep "No differences"
      - name: Start built-in web server
        run: nohup php -S 127.0.0.1:8080 -t web > /tmp/php-server.log 2>&1 &
      - name: Wait for web server
        run: curl -fsS --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8080/user/login
      - run: ./bin/drush en dblog
      - name: Check the Drupal board listing
        run: |
          ./bin/drush php:eval '
            use Drupal\contribkanban_boards\Entity\Board;
            use Drupal\contribkanban_boards\Entity\BoardList;
            Board::create([
              "type" => "drupalorg_core",
              "title" => "Smoke test board",
              "lists" => [BoardList::create(["type" => "drupalorg_core", "title" => "Active", "statuses" => [1]])],
            ])->save();
            Board::create([
              "type" => "drupalorg_core",
              "title" => "Review first board",
              "lists" => [BoardList::create(["type" => "drupalorg_core", "title" => "Needs review", "statuses" => [8]])],
            ])->save();
            Board::create([
              "type" => "drupalorg_project",
              "title" => "Smoke test project",
              "machine_name" => "smoke_test_project",
              "project_nid" => [1],
              "lists" => [BoardList::create(["type" => "drupalorg_project", "title" => "Active", "statuses" => [1]])],
            ])->save();
            // A GitLab label drupal.org has no tag for.
            Board::create([
              "type" => "drupalorg_sprint",
              "title" => "ci::label-only",
              "lists" => [BoardList::create(["type" => "drupalorg_sprint", "title" => "Active", "statuses" => [1]])],
            ])->save();'
          ./bin/drush search-api:index
          curl -fsS "http://127.0.0.1:8080/boards?search=smoke" | grep "Smoke test board"
          curl -fsS "http://127.0.0.1:8080/boards?type=drupalorg_sprint&search=smoke" | grep "No boards match"
          curl -fsS "http://127.0.0.1:8080/boards" | grep 'id="contribkanban-create-board"'
          # No popular searches until an admin picks some.
          test "$(curl -fsS "http://127.0.0.1:8080/boards" | grep -c 'class="popular-searches"')" = 0
          ./bin/drush php:eval '\Drupal::service("contribkanban_boards.popular_boards")->set(array_keys(\Drupal::entityTypeManager()->getStorage("board")->loadByProperties(["title" => "Smoke test project"])));'
          # With no search, the listing shows only the popular boards, as cards.
          curl -fsS "http://127.0.0.1:8080/boards" | grep 'class="board-card" href="/board/smoke_test_project"'
          test "$(curl -fsS "http://127.0.0.1:8080/boards" | grep -c 'class="board-card"')" = 1
          # A search lists every match, with the popular boards above it.
          curl -fsS "http://127.0.0.1:8080/boards?search=smoke" | grep 'class="board-card" href="/board/Smoketestboard"'
          curl -fsS "http://127.0.0.1:8080/boards?search=smoke" | grep 'class="popular-searches__link" href="/board/smoke_test_project"'
          curl -fsS "http://127.0.0.1:8080/boards/new" | grep "Project machine name"
          curl -fsS "http://127.0.0.1:8080/board/Smoketestboard" | grep 'data-board="'
          # Only boards that start with Needs review explain their lane order.
          test "$(curl -fsS "http://127.0.0.1:8080/board/Smoketestboard" | grep -c "Why does Needs review come first?")" = 0
          curl -fsS "http://127.0.0.1:8080/board/Reviewfirstboard" | grep "Why does Needs review come first?"

          # The theme renders the roulette with its component.
          curl -fsS "http://127.0.0.1:8080/roulette" | grep 'class="issue-roulette__app"'
          # Project boards roll for their project's issues, and the roulette links back.
          curl -fsS "http://127.0.0.1:8080/board/smoke_test_project" | grep 'href="/roulette?project=smoke_test_project"'
          curl -fsS "http://127.0.0.1:8080/roulette?project=smoke_test_project" | grep 'Smoke test project</a>'
          # With a tag, project is the Project filter on the tag's issues.
          test "$(curl -fsS "http://127.0.0.1:8080/roulette?tag=Novice&project=smoke_test_project" | grep -c 'Smoke test project</a>')" = 0
          # A GitLab label's board has no drupal.org tag, and the roulette lists it.
          curl -fsS "http://127.0.0.1:8080/sprint/ci::label-only-tag" | grep 'Work items from <a href="https://git.drupalcode.org/groups/project/-/work_items?label_name\[\]=ci%3A%3Alabel-only">'
          curl -fsS "http://127.0.0.1:8080/roulette?tag=ci::label-only" | grep 'ci::label-only'

          # Boards offer an Embed button, and embedded boards leave out the site and the roulette, and other sites can frame them.
          curl -fsS "http://127.0.0.1:8080/board/smoke_test_project" | grep 'data-board-embed="/board/smoke_test_project/embed"'
          # Only logged-in users get the Bookmark button.
          test "$(curl -fsS "http://127.0.0.1:8080/board/smoke_test_project" | grep -c 'board-shell__bookmark')" = 0
          embed="$(curl -fsS -D - "http://127.0.0.1:8080/board/smoke_test_project/embed")"
          echo "$embed" | grep 'class="board-shell board-shell--embed"'
          test "$(echo "$embed" | grep -ciE 'x-frame-options|site-footer|board-shell__roulette')" = 0
          curl -fsS -o /dev/null -D - "http://127.0.0.1:8080/board/smoke_test_project" | grep -i 'x-frame-options: SAMEORIGIN'
      - name: Check redirects from React app paths
        run: |
          redirect() {
            test "$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "http://127.0.0.1:8080$1")" = "301 http://127.0.0.1:8080$2"
          }
          redirect /login /user/login
          redirect /logout /user/logout/confirm
          redirect /create /boards/new
          redirect /boards/sprint "/boards?type=drupalorg_sprint"
      - name: Show watchdog log
        if: always()
        run: ./bin/drush wd-show
