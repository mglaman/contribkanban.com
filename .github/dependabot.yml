version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Major core upgrades need real migration work, not a Dependabot PR.
    ignore:
      - dependency-name: "drupal/core*"
        update-types: ["version-update:semver-major"]
    # core-recommended pins drupal/core, so the core packages must move
    # together or Composer cannot resolve the update.
    groups:
      drupal-core:
        patterns:
          - "drupal/core*"
      drupal-core-security:
        applies-to: security-updates
        patterns:
          - "drupal/core*"
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
