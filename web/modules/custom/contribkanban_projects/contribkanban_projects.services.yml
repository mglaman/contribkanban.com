parameters:
  contribkanban_projects.drupalorg_client.config:
    base_uri: 'https://www.drupal.org/api-d7/'
    headers:
      Accept: 'application/json'
      User-Agent: 'ContribKanban/1.0 (https://contribkanban.com)'

services:
  drupalorg_client:
    class: GuzzleHttp\Client
    factory: http_client_factory:fromOptions
    arguments: ['%contribkanban_projects.drupalorg_client.config%']
  drupalorg_projects:
    class: Drupal\contribkanban_projects\Projects
    arguments: ['@drupalorg_client']
  drupalorg_tags:
    class: Drupal\contribkanban_projects\Tags
    arguments: ['@drupalorg_client']
