$schema: https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/assets/schemas/v1/metadata.schema.json
name: Board shell
description: The board page. The board island, this component's JavaScript, renders the filters and the issues in each column.
status: stable
props:
  type: object
  required:
    - title
    - config
  properties:
    title:
      type: string
      title: Board title
    back_url:
      type: string
      title: Board listing URL
    source_url:
      type: string
      title: Where the issues come from, on drupal.org or GitLab
    edit_url:
      type: string
      title: Edit form URL, for people who can edit the board
    config:
      type: object
      title: Board configuration
      description: Read by the board island. See BoardIslandConfig::build().
      required:
        - source
        - lists
      properties:
        source:
          type: string
          enum:
            - gitlab
            - drupalorg
        gitlabProject:
          type:
            - string
            - 'null'
        nids:
          type: array
          description: An issue collection's drupal.org node IDs. The island loads them once and sorts them into the lists by status.
          items:
            type: string
        lists:
          type: array
          items:
            type: object
